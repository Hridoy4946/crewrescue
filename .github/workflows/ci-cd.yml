name: CrewRescue CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 1: Code Quality & Linting
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install || true

      - name: Lint API
        run: npm run lint --workspace=backend/api --if-present || true

      - name: Lint Web
        run: npm run lint --workspace=frontend/web --if-present || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 2: Security Audit
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install || true

      - name: npm audit (API)
        working-directory: backend/api
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: npm audit (Web)
        working-directory: frontend/web
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Ensure reports directory exists
        run: mkdir -p reports/dependency-check

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'CrewRescue AI'
          path: '.'
          format: 'HTML'
          out: 'reports/dependency-check'
          args: >
            --enableRetired
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 3: Build Web App
  # ─────────────────────────────────────────────────────────────────────────────
  build-web:
    name: 🏗️ Build Web App
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install || true

      - name: Build Vite app
        run: npm run build --workspace=frontend/web || true
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:5000/api' }}
          VITE_WS_URL:  ${{ vars.VITE_WS_URL  || 'http://localhost:5000' }}

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/web/dist/
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 4: Docker Build & Push
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-web, security]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image tags
        run: |
          echo "IMAGE_API=ghcr.io/${GITHUB_REPOSITORY,,}/crewrescue-api" >> $GITHUB_ENV
          echo "IMAGE_WEB=ghcr.io/${GITHUB_REPOSITORY,,}/crewrescue-web" >> $GITHUB_ENV

      - name: Download web dist
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-dist
          path: frontend/web/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract metadata for Web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 5: Trivy Container Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  trivy:
    name: 🛡️ Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image tag
        run: |
          echo "IMAGE_API=ghcr.io/${GITHUB_REPOSITORY,,}/crewrescue-api" >> $GITHUB_ENV

      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_API }}:latest
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 6: Deployment Notification
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: 📣 Deployment Summary
    runs-on: ubuntu-latest
    needs: [lint, security, build-web, docker, trivy]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## CrewRescue AI — Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security.result }} \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Web Build | ${{ needs.build-web.result }} \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Push | ${{ needs.docker.result }} \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Scan | ${{ needs.trivy.result }} \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\` | **SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY