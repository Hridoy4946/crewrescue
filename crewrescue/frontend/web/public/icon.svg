<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="falcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  <!-- Falcon body - swooping right/down -->
  <!-- Main body -->
  <path d="M18 20 C22 16, 34 14, 42 20 C46 23, 46 28, 44 30 C40 34, 36 32, 32 34 C28 36, 26 42, 24 46 L20 44 C22 38, 24 34, 22 30 C20 26, 16 24, 18 20Z" fill="url(#falcon)"/>
  <!-- Left wing -->
  <path d="M18 22 C12 18, 8 20, 6 25 C8 24, 12 22, 16 26 Z" fill="#7dd3fc"/>
  <!-- Right wing extended -->
  <path d="M38 16 C44 10, 54 10, 58 14 C52 14, 46 16, 44 22 Z" fill="#7dd3fc"/>
  <!-- Top wing sweep -->
  <path d="M26 18 C30 12, 40 10, 50 12 C44 14, 38 16, 36 22 Z" fill="#bae6fd" opacity="0.8"/>
  <!-- Head -->
  <ellipse cx="44" cy="29" rx="5" ry="5.5" fill="url(#falcon)" transform="rotate(-15 44 29)"/>
  <!-- Eye -->
  <circle cx="46" cy="27" r="1.5" fill="#0f172a"/>
  <circle cx="46.4" cy="26.6" r="0.5" fill="white"/>
  <!-- Beak -->
  <path d="M49 29 L54 32 L51 33 Z" fill="url(#accent)"/>
  <!-- Talons -->
  <path d="M24 44 C22 48, 20 50, 18 52" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M26 45 C26 49, 25 51, 24 53" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M22 43 C18 46, 16 48, 14 50" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Wing detail lines -->
  <path d="M28 20 C32 18, 38 16, 44 18" stroke="#0ea5e9" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M24 24 C28 22, 34 20, 40 22" stroke="#0ea5e9" stroke-width="0.8" fill="none" opacity="0.6"/>
</svg>
