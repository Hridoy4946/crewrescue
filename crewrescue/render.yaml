services:
  - type: web
    name: crewrescue-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace=backend/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: worker
    name: crewrescue-worker
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run worker --workspace=backend/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
