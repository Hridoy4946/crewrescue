name: CrewRescue AI — CI/CD Pipeline & Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/crewrescue

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ── 1. Quality & Linting Gate ───────────────────────────────────────────────
  lint-and-validate:
    name: Lint & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Validate Production Builds
        run: npm run build

  # ── 2. Container Build, Trivy Security Scan & Registry Push ──────────────────
  build-scan-push:
    name: Build, Scan & Push Images
    needs: lint-and-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component:
          - name: api
            dockerfile: infrastructure/docker/api.Dockerfile
            image: crewrescue-api
          - name: web
            dockerfile: infrastructure/docker/web.Dockerfile
            image: crewrescue-web
          - name: pwa
            dockerfile: infrastructure/docker/pwa.Dockerfile
            image: crewrescue-pwa

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (Local daemon for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.name }}:latest

      # ── Trivy Vulnerability Scanner ─────────────────────────────────────────
      - name: Run Trivy Vulnerability Scanner (Fails on Critical/High CVEs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.name }}:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # ── Push to Registry (Only on main push) ────────────────────────────────
      - name: Push Immutably Tagged Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component.name }}:latest
