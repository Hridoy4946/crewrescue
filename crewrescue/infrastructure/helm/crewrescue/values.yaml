replicaCount: 2

image:
  api: crewrescue-api:latest
  web: crewrescue-web:latest
  pullPolicy: Always

service:
  api:
    port: 5000
  web:
    port: 80

resources:
  api:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  web:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
