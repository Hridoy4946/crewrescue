apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: crewrescue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crewrescue
      component: redis
  template:
    metadata:
      labels:
        app: crewrescue
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: crewrescue
spec:
  selector:
    app: crewrescue
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
