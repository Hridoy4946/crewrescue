{{- if .Values.redis.embedded }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crewrescue.fullname" . }}-redis
  labels:
    {{- include "crewrescue.labels" . | nindent 4 }}
    app.kubernetes.io/component: queue
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "crewrescue.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: queue
  template:
    metadata:
      labels:
        {{- include "crewrescue.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: queue
    spec:
      nodeSelector:
        workload: compute-db
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crewrescue.fullname" . }}-redis
  labels:
    {{- include "crewrescue.labels" . | nindent 4 }}
    app.kubernetes.io/component: queue
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    {{- include "crewrescue.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: queue
{{- end }}
