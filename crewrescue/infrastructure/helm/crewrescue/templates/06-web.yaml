apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: crewrescue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crewrescue
      component: web
  template:
    metadata:
      labels:
        app: crewrescue
        component: web
    spec:
      containers:
        - name: web
          image: crewrescue-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: crewrescue
spec:
  selector:
    app: crewrescue
    component: web
  ports:
    - port: 80
      targetPort: 80
