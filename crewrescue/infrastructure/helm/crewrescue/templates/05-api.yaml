apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: crewrescue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crewrescue
      component: api
  template:
    metadata:
      labels:
        app: crewrescue
        component: api
    spec:
      containers:
        - name: api
          image: crewrescue-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: crewrescue-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: crewrescue
spec:
  selector:
    app: crewrescue
    component: api
  ports:
    - port: 5000
      targetPort: 5000
