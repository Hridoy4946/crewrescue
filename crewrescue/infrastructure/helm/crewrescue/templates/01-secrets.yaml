apiVersion: v1
kind: Secret
metadata:
  name: crewrescue-secrets
  namespace: crewrescue
type: Opaque
stringData:
  JWT_ACCESS_SECRET: "CHANGE_ME_GENERATE_RANDOM_64_BYTE_HEX"
  JWT_REFRESH_SECRET: "CHANGE_ME_GENERATE_RANDOM_64_BYTE_HEX_DIFFERENT"
  MONGODB_URI: "mongodb://crewrescue-mongo:27017/crewrescue"
  REDIS_URL: "redis://crewrescue-redis:6379"
  GEMINI_API_KEY: "REPLACE_WITH_YOUR_GEMINI_API_KEY"
