{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "crewrescue.fullname" . }}-ingress
  labels:
    {{- include "crewrescue.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    # Path-based routing: / -> Web console, /pwa -> Technician PWA, /api -> Backend API
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "crewrescue.fullname" . }}-api
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: {{ include "crewrescue.fullname" . }}-api
                port:
                  number: 5000
          - path: /pwa
            pathType: Prefix
            backend:
              service:
                name: {{ include "crewrescue.fullname" . }}-pwa
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "crewrescue.fullname" . }}-web
                port:
                  number: 80

    # Optional Subdomain routing (if DNS configured)
    - host: app.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "crewrescue.fullname" . }}-web
                port:
                  number: 80
    - host: field.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "crewrescue.fullname" . }}-pwa
                port:
                  number: 80
    - host: api.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "crewrescue.fullname" . }}-api
                port:
                  number: 5000
{{- end }}
