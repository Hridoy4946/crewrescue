# ─────────────────────────────────────────────────────────────────────────────
# CrewRescue AI — KIND Multi-Node Cluster Configuration
# 1 Control-Plane Node + 2 Dedicated Worker Nodes
# ─────────────────────────────────────────────────────────────────────────────
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: crewrescue-cluster
nodes:
  # ── Control Plane ────────────────────────────────────────────────────────────
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP Ingress (Web, PWA, API)
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
      # HTTPS Ingress
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      # ArgoCD UI Port
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # Prometheus / Metrics NodePort
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP

  # ── Worker 1: Frontend & API Ingress Node ────────────────────────────────────
  - role: worker
    labels:
      workload: frontend-api
      node-role.kubernetes.io/worker: "web-api"
      topology.kubernetes.io/zone: zone-a

  # ── Worker 2: Compute Solver & Database Node ─────────────────────────────────
  - role: worker
    labels:
      workload: compute-db
      node-role.kubernetes.io/worker: "compute"
      topology.kubernetes.io/zone: zone-b
