apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crewrescue
  namespace: argocd
  labels:
    app.kubernetes.io/name: crewrescue
    app.kubernetes.io/part-of: emergency-operations
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Hridoy4946/crewrescue.git
    targetRevision: main
    path: infrastructure/helm/crewrescue
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: crewrescue
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
