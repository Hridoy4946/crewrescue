version: '3.9'

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: crewrescue-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: crewrescue
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - crewrescue-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: crewrescue-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - crewrescue-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: crewrescue-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/crewrescue
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:5174
    networks:
      - crewrescue-net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── BullMQ Optimization Worker ───────────────────────────────────────────────
  # Runs the SA/GA solver worker, consuming jobs from the Redis-backed BullMQ queue
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: crewrescue-worker
    restart: unless-stopped
    command: ["node", "backend/api/src/workers/optimizationWorker.js"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/crewrescue
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - crewrescue-net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      replicas: 1            # Scale to 2+ for heavy optimization load
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ── Frontend Web Console ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: crewrescue-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - crewrescue-net
    depends_on:
      api:
        condition: service_healthy

  # ── Mobile Field Technician PWA ──────────────────────────────────────────────
  pwa:
    build:
      context: .
      dockerfile: infrastructure/docker/pwa.Dockerfile
    container_name: crewrescue-pwa
    restart: unless-stopped
    ports:
      - "5174:80"
    networks:
      - crewrescue-net
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:

networks:
  crewrescue-net:
    driver: bridge

